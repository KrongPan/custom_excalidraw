services:
  boards:
    build:
      # the repository root, so the image can carry gallery/build.mjs and
      # scripts/migrate-scenes.mjs (see app/Dockerfile)
      context: .
      dockerfile: app/Dockerfile
    image: excalidraw-boards:latest
    container_name: excalidraw-boards
    ports:
      - "5001:5002"
    volumes:
      # one folder per board: <id>/scene.excalidraw + meta.json + history/
      - ./gallery/scenes:/data
      # catalogue page + previews: written at boot and refreshed after every save
      # (the server runs gallery/build.mjs --no-render; PNG previews come from the
      # host: `node scripts/watch-previews.mjs` keeps them in step automatically)
      - ./gallery/site:/gallery
    environment:
      # keep the catalogue in step with the boards while the container runs
      GALLERY_BUILD: /srv/tools/build.mjs
      SKIP_GALLERY: "0"
    # keep files on the host owned by you instead of root
    user: "${DOCKER_UID:-501}:${DOCKER_GID:-20}"
    restart: unless-stopped
